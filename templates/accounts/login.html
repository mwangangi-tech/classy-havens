{% extends "base.html" %}
{% block title %}Login — Classy Havens{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h1>Login</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-dark w-100">Login</button>
</form>
<p class="mt-3">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
</div></div>
{% endblock %}
