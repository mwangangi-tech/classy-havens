{% extends "base.html" %}
{% block title %}Register — Classy Havens{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<h1>Create Account</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-dark w-100">Register</button>
</form>
<p class="mt-3">Already registered? <a href="{% url 'accounts:login' %}">Login</a></p>
</div></div>
{% endblock %}
