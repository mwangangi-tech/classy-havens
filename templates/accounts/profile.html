{% extends "base.html" %}
{% block title %}My Profile — Classy Havens{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-4 mb-4">
        <div class="card text-center p-3">
            {% if user.avatar %}
                <img src="{{ user.avatar.url }}" alt="Avatar"
                     style="width:160px;height:160px;object-fit:cover;border-radius:50%;margin:0 auto;">
            {% else %}
                <div style="width:160px;height:160px;border-radius:50%;
                            background:#f3efe9;display:flex;align-items:center;
                            justify-content:center;margin:0 auto;font-size:3rem;color:#c9a961;">
                    {{ user.username|first|upper }}
                </div>
            {% endif %}
            <h3 class="mt-3">{{ user.username }}</h3>
            <p class="text-muted">{{ user.get_role_display }}</p>
        </div>
    </div>
    <div class="col-md-8">
        <h1>Update profile</h1>
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-dark">Save</button>
        </form>
    </div>
</div>
{% endblock %}
