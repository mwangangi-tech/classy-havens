{% extends "base.html" %}
{% block title %}Change Password — Classy Havens{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 shadow-sm border-0">
            <h2 class="text-center mb-4">Change Password</h2>
            
            <form method="post" novalidate>
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert alert-danger">
                    Please correct the errors below.
                </div>
                {% endif %}

                <div class="mb-4">
                    <label class="form-label">Current Password</label>
                    <input type="password" name="old_password" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password1" class="form-control" required>
                    <small class="text-muted">Minimum 10 characters. Cannot be entirely numeric.</small>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="new_password2" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-3">Update Password</button>
                <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
